<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#dc2626" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">EXIDE SOLAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="115" width="240" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
     <rect x="210" y="145" width="180" height="90" rx="14" fill="#0f172a"/>
     <text x="300" y="190" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff">5.12 kWh</text>
     <text x="300" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#22c55e">51.2V 100Ah LiFePO4</text>
     <rect x="225" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="244" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="263" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="282" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="301" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="320" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="339" y="260" width="13" height="24" rx="3" fill="#22c55e"/><rect x="358" y="260" width="13" height="24" rx="3" fill="#22c55e"/>
     <rect x="210" y="315" width="180" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
     <circle cx="245" cy="348" r="10" fill="#ef4444"/>
     <circle cx="355" cy="348" r="10" fill="#0f172a"/>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#dc2626"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Exide 5.12kWh LFP Battery</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">LITHIUM BATTERY STORAGE • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#dc2626" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#dc2626">GENUINE</text>
  </g>
</svg>