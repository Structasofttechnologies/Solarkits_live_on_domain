<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#0284c7" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">EMMVEE SOLAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <ellipse cx="300" cy="150" rx="140" ry="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
     <text x="300" y="156" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#0f172a">200 LPD PUF TANK</text>
     <!-- Evacuated Glass Tubes -->
     <line x1="185" y1="185" x2="235" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="210" y1="185" x2="260" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="235" y1="185" x2="285" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="260" y1="185" x2="310" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="285" y1="185" x2="335" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="310" y1="185" x2="360" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="335" y1="185" x2="385" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="360" y1="185" x2="410" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="385" y1="185" x2="435" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><line x1="410" y1="185" x2="460" y2="390" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
     <!-- Frame Stand -->
     <line x1="160" y1="180" x2="160" y2="410" stroke="#475569" stroke-width="6"/>
     <line x1="440" y1="180" x2="440" y2="410" stroke="#475569" stroke-width="6"/>
     <line x1="150" y1="410" x2="450" y2="410" stroke="#475569" stroke-width="6"/>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#0284c7"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Emmvee 200 LPD Solar Heater</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SOLAR THERMAL ETC • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#0284c7" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#0284c7">GENUINE</text>
  </g>
</svg>