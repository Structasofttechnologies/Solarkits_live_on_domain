<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#0284c7" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">ADANI SOLAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="190" y="80" width="220" height="370" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="6"/>
     <g stroke="#38bdf8" stroke-width="1" opacity="0.6">
       <line x1="194" y1="105" x2="406" y2="105"/><line x1="194" y1="133" x2="406" y2="133"/><line x1="194" y1="161" x2="406" y2="161"/><line x1="194" y1="189" x2="406" y2="189"/><line x1="194" y1="217" x2="406" y2="217"/><line x1="194" y1="245" x2="406" y2="245"/><line x1="194" y1="273" x2="406" y2="273"/><line x1="194" y1="301" x2="406" y2="301"/><line x1="194" y1="329" x2="406" y2="329"/><line x1="194" y1="357" x2="406" y2="357"/><line x1="194" y1="385" x2="406" y2="385"/><line x1="194" y1="413" x2="406" y2="413"/>
       <line x1="215" y1="84" x2="215" y2="446"/><line x1="247" y1="84" x2="247" y2="446"/><line x1="279" y1="84" x2="279" y2="446"/><line x1="311" y1="84" x2="311" y2="446"/><line x1="343" y1="84" x2="343" y2="446"/><line x1="375" y1="84" x2="375" y2="446"/>
     </g>
     <rect x="270" y="445" width="60" height="18" rx="4" fill="#1e293b"/>
     <path d="M 285 463 Q 275 485 260 488" stroke="#000000" stroke-width="4" fill="none"/>
     <path d="M 315 463 Q 325 485 340 488" stroke="#ef4444" stroke-width="4" fill="none"/>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#0284c7"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Adani 580W TOPCon Module</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SOLAR PV MODULE • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#0284c7" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#0284c7">GENUINE</text>
  </g>
</svg>