<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#0284c7" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">LUMINOUS</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="190" y="135" width="220" height="285" rx="16" fill="#0284c7" stroke="#0369a1" stroke-width="4"/>
     <rect x="180" y="130" width="240" height="40" rx="8" fill="#1e293b"/>
     <!-- 6 Float Indicators -->
     <rect x="205" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="213" cy="115" r="4" fill="#ef4444"/><rect x="239" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="247" cy="115" r="4" fill="#ef4444"/><rect x="273" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="281" cy="115" r="4" fill="#ef4444"/><rect x="307" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="315" cy="115" r="4" fill="#ef4444"/><rect x="341" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="349" cy="115" r="4" fill="#ef4444"/><rect x="375" y="105" width="16" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="383" cy="115" r="4" fill="#ef4444"/>
     <text x="300" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">150 Ah</text>
     <text x="300" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#93c5fd">SOLAR TALL TUBULAR C10</text>
     <rect x="220" y="330" width="160" height="45" rx="8" fill="#0369a1"/>
     <text x="300" y="358" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff">36M WARRANTY</text>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#0284c7"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Luminous 150Ah Tall Tubular</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">DEEP CYCLE LEAD ACID • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#0284c7" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#0284c7">GENUINE</text>
  </g>
</svg>