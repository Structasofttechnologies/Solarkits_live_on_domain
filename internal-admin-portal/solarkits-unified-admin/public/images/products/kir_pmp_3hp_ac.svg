<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#059669" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">KIRLOSKAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="260" y="90" width="80" height="350" rx="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
     <rect x="268" y="105" width="64" height="160" rx="8" fill="#cbd5e1"/>
     <line x1="268" y1="130" x2="332" y2="130" stroke="#64748b" stroke-width="2"/><line x1="268" y1="152" x2="332" y2="152" stroke="#64748b" stroke-width="2"/><line x1="268" y1="174" x2="332" y2="174" stroke="#64748b" stroke-width="2"/><line x1="268" y1="196" x2="332" y2="196" stroke="#64748b" stroke-width="2"/><line x1="268" y1="218" x2="332" y2="218" stroke="#64748b" stroke-width="2"/><line x1="268" y1="240" x2="332" y2="240" stroke="#64748b" stroke-width="2"/>
     <rect x="272" y="280" width="56" height="140" fill="#059669" rx="4"/>
     <text x="300" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" transform="rotate(-90 300 355)">3 HP AC PUMP</text>
     <path d="M 300 90 L 300 65 L 340 65" stroke="#000000" stroke-width="6" fill="none"/>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#059669"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Kirloskar 3 HP Submersible Pump</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SOLAR WATER PUMP • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#059669" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#059669">GENUINE</text>
  </g>
</svg>