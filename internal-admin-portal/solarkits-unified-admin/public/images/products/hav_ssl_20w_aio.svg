<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#ea580c" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">HAVELLS SOLAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="200" y="100" width="200" height="320" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
     <!-- Integrated Solar Panel on Top Half -->
     <rect x="215" y="115" width="170" height="130" rx="8" fill="#0f172a"/>
     <line x1="215" y1="145" x2="385" y2="145" stroke="#0284c7" stroke-width="1.5"/><line x1="215" y1="173" x2="385" y2="173" stroke="#0284c7" stroke-width="1.5"/><line x1="215" y1="201" x2="385" y2="201" stroke="#0284c7" stroke-width="1.5"/><line x1="215" y1="229" x2="385" y2="229" stroke="#0284c7" stroke-width="1.5"/>
     <!-- LED Light Panel on Bottom Half -->
     <rect x="220" y="260" width="160" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
     <circle cx="240" cy="285" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="280" cy="285" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="320" cy="285" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="360" cy="285" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="240" cy="310" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="280" cy="310" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="320" cy="310" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="360" cy="310" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="240" cy="335" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="280" cy="335" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="320" cy="335" r="7" fill="#fbbf24" filter="url(#softGlow)"/><circle cx="360" cy="335" r="7" fill="#fbbf24" filter="url(#softGlow)"/>
     <!-- PIR Sensor -->
     <circle cx="300" cy="380" r="14" fill="#cbd5e1"/>
     <circle cx="300" cy="380" r="6" fill="#3b82f6"/>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#ea580c"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Havells 20W All-in-One Light</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SOLAR LED STREET LIGHT • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#ea580c" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ea580c">GENUINE</text>
  </g>
</svg>