<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background with Subtle Grid Pattern -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="220" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="270" r="160" fill="#ea580c" opacity="0.04"/>

  <!-- Category & Brand Header Watermark -->
  <rect x="40" y="32" width="120" height="28" rx="14" fill="#0f172a" opacity="0.05"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="1.5">HAVELLS SOLAR</text>

  <!-- Dynamic Product Visual Graphic -->
  <g filter="url(#dropShadow)">
    <rect x="170" y="60" width="260" height="110" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" transform="rotate(-8 300 115)"/>
     <rect x="290" y="170" width="20" height="110" fill="#64748b"/>
     <rect x="220" y="270" width="160" height="130" rx="16" fill="#334155"/>
     <rect x="235" y="285" width="130" height="90" rx="10" fill="#ffffff"/>
     <circle cx="252" cy="305" r="6" fill="#f59e0b"/><circle cx="284" cy="305" r="6" fill="#f59e0b"/><circle cx="316" cy="305" r="6" fill="#f59e0b"/><circle cx="348" cy="305" r="6" fill="#f59e0b"/><circle cx="252" cy="325" r="6" fill="#f59e0b"/><circle cx="284" cy="325" r="6" fill="#f59e0b"/><circle cx="316" cy="325" r="6" fill="#f59e0b"/><circle cx="348" cy="325" r="6" fill="#f59e0b"/><circle cx="252" cy="345" r="6" fill="#f59e0b"/><circle cx="284" cy="345" r="6" fill="#f59e0b"/><circle cx="316" cy="345" r="6" fill="#f59e0b"/><circle cx="348" cy="345" r="6" fill="#f59e0b"/><circle cx="252" cy="365" r="6" fill="#f59e0b"/><circle cx="284" cy="365" r="6" fill="#f59e0b"/><circle cx="316" cy="365" r="6" fill="#f59e0b"/><circle cx="348" cy="365" r="6" fill="#f59e0b"/>
     <text x="300" y="420" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#0f172a">40W HIGH-LUMEN LED</text>
  </g>

  <!-- Technical Label Footer Badge -->
  <g transform="translate(60, 505)">
    <rect width="480" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#dropShadow)"/>
    <circle cx="36" cy="31" r="10" fill="#ea580c"/>
    <circle cx="36" cy="31" r="4" fill="#ffffff"/>
    <text x="60" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#0f172a">Havells 40W Semi-Integrated</text>
    <text x="60" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">HIGHWAY SOLAR LIGHTING • CERTIFIED SOLAR HARDWARE</text>
    <rect x="400" y="19" width="60" height="24" rx="8" fill="#ea580c" opacity="0.12"/>
    <text x="430" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ea580c">GENUINE</text>
  </g>
</svg>