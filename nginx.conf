events {}

http {
    include       C:/nginx-1.30.3/nginx-1.30.3/conf/mime.types;
    default_type  application/octet-stream;

    server {
        listen 5176;
        server_name localhost;

 	# ---------------- AUTH APP (React Dev - 5173) ----------------
        location / {
            proxy_pass http://localhost:5173;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }

        # ---------------- ADMIN APP (React Dev - 5174) ----------------
        location /admin-panel/ {
            proxy_pass http://localhost:5174;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }

	# ---------------- DEVELOPER APP (React Dev - 5175) ----------------
        location /developer-panel/ {
            proxy_pass http://localhost:5175;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }

	# ---------------- OPERATION MANAGEMENT APP (React Dev - 5178) ----------------
        location /operation-management-panel/ {
            proxy_pass http://localhost:5178;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }

        # ---------------- WAREHOUSE APP (React Dev - 5179) ----------------
        location /warehouse-management-panel/ {
            proxy_pass http://localhost:5179;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }

        # ---------------- ACCOUNT PANEL APP (React Dev - 5180) ----------------
        location /account-panel/ {
            proxy_pass http://localhost:5180;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_cache_bypass $http_upgrade;
        }


	location /auth-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }

	location /admin-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /developer-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /operation-management-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /warehouse-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }

	location /account-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /supplier-api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;
        }
	location /developer-api/events/ {
    		proxy_pass http://127.0.0.1:5000/developer-api/events/;

    		proxy_http_version 1.1;

    		proxy_set_header Connection '';

    		proxy_buffering off;      
    		proxy_cache off;

    		proxy_read_timeout 1h; 
    		proxy_send_timeout 1h;

    		chunked_transfer_encoding off;

    		add_header Cache-Control no-cache;
	}
    }
}
